name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  secret-scan:
    name: Secret Scan
    uses: kontourai/.github/.github/workflows/secret-scan.yml@main
    permissions:
      contents: read

  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v7
        with:
          path: dispatch
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: dispatch/package-lock.json
      - run: npm ci
        working-directory: dispatch
      - run: npm run verify
        working-directory: dispatch
      - run: npm run veritas:readiness -- --run-id "ci-${{ github.run_id }}-${{ matrix.node-version }}" --force
        working-directory: dispatch
