# Trust Verify — adopts the Flow Agents external trust anchor on this repo
# (ADVISORY phase: reports but does not yet block merges).
#
# On every PR, re-runs this repo's canonical verification FRESH in a clean CI
# environment an agent does not control. If a Flow Agents session has published
# delivery/trust.bundle, it also RECONCILES the agent's claimed passes against
# CI's own fresh results and fails on any divergence. Advisory on bundle
# absence; fail-closed on divergence when a bundle is present.
#
# To ARM it: add "Trust Verify" as a required, no-bypass status check in this
# repo's branch protection. Until then it runs and reports but does not block.
#
# Adoption guide: https://github.com/kontourai/flow-agents/blob/main/docs/trust-anchor-adoption.md
name: Trust Verify

on:
  pull_request:

permissions:
  contents: read

jobs:
  trust-verify:
    name: Trust Verify
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0: the reconciler binds delivery bundles to commits via
      # `git merge-base --is-ancestor`, which cannot walk a shallow clone.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      # SHA-pinned at the build that names which DECLARED condition failed
      # (flow-agents#1015) — pinned current at adoption, not copied stale.
      - uses: kontourai/flow-agents/.github/actions/trust-verify@e5f348b49f8130f9d452e73b104ba328f9916981 # flow-agents @ reports which DECLARED condition failed (#1015)
        with:
          verify-command: "npm run verify"
